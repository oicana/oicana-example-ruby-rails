name: CI

on:
  pull_request:
  push:
    branches:
     - main
  workflow_dispatch:

jobs:
  rails-ci:
    name: Linting, security checks, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: run bin/ci
        run: bin/ci

  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v6
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.35.5

  validate-links:
    name: Check for dead links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check readme links
        run: npx linkinator README.md --config .github/linkinator.config.json
